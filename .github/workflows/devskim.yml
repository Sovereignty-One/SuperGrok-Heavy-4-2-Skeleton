# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 21 * * 5'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install DevSkim CLI
        run: |
          dotnet tool install --global Microsoft.CST.DevSkim.CLI --version 1.0.16
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run DevSkim scanner
        continue-on-error: true
        run: devskim analyze --source-code . --output-file devskim-results.sarif --file-format sarif

      - name: Upload DevSkim scan results to GitHub Security tab
        if: always() && hashFiles('devskim-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif
