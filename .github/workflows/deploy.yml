name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio flake8

      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120

      - name: Run tests
        run: pytest --tb=short -q
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:9897
          SECRET_KEY: test-secret-key-for-ci-only-not-production-use-1234

  security-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax check security sentinel
        run: python -m py_compile security_sentinel.py
        working-directory: .

      - name: Run security sentinel single-pass check
        run: python security_sentinel.py --check
        working-directory: .

  build:
    needs: [test, security-sentinel]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify deploy file layout
        run: |
          set -euxo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Revision: ${GITHUB_SHA}"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          git remote -v
          git rev-parse HEAD
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

          missing=0
          for file in Dockerfile.backend supergrok-enterprise/Dockerfile docker-compose.yml security_sentinel.py; do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Missing required deploy file: ${file}"
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Build backend Docker image
        run: docker build -t sovereignty-backend -f Dockerfile.backend .

      - name: Build frontend Docker image
        run: docker build -t sovereignty-frontend ./supergrok-enterprise

      - name: Verify Docker Compose config
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-test-password
          SECRET_KEY: ci-test-secret-key-for-validation-only-1234
