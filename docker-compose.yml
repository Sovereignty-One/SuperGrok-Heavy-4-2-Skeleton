services:
  backend:
    build: ./backend
    ports:
      - "9898:9898"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "9899:9899"
    environment:
      - API_URL=http://backend:9898
    depends_on:
      - backend

  redis:
    image: redis:7
    ports:
      - "6379:6379"
