version: '3.8'

services:
  backend:
    build: ./backend
    # No external port exposure - only accessible within Docker network
    expose:
      - "9898"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/creativeflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-}
      - ALGORITHM=HS256
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-sovereignty}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-sovereignty-app}
    depends_on:
      - db
      - redis
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-sovereignty_db}
      - KC_DB_USERNAME=${POSTGRES_USER:-postgres}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-password}
    command: start-dev
    depends_on:
      - db

  node-bridge:
    build: ./node-bridge
    ports:
      - "9899:9899"
    environment:
      - BACKEND_URL=http://backend:9898
      - WEATHER_URL=http://backend:9898
      - NODE_BRIDGE_PORT=9899
      - CORS_ORIGIN=http://localhost:9899
      - KEYCLOAK_URL=http://keycloak:8080
    depends_on:
      - backend
      - keycloak

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: creativeflow_db
    # No external port exposure - only accessible within Docker network
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    # No external port exposure - only accessible within Docker network
    # Bind to localhost only via command
    command: redis-server --bind 127.0.0.1 --protected-mode yes
    expose:
      - "6379"

volumes:
  db_data: