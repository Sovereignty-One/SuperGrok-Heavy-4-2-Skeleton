🔷 1. WebSocket Bridge (PORT 9899)

Add this to your gateway — this is the missing backbone for your terminal.

# gateway/ws_bridge.py
import json
import uuid
from aiohttp import web

async def websocket_handler(request: web.Request) -> web.WebSocketResponse:
    ws = web.WebSocketResponse()
    await ws.prepare(request)

    app = request.app
    router = app["ai_router"]
    voice = app["voice_assist"]
    plugin = app["plugin_agent"]

    session_id = str(uuid.uuid4())

    await ws.send_json({
        "type": "system",
        "status": "connected",
        "session": session_id
    })

    async for msg in ws:
        if msg.type == web.WSMsgType.TEXT:
            try:
                data = json.loads(msg.data)
            except Exception:
                await ws.send_json({"error": "invalid_json"})
                continue

            route = data.get("route", "chat")

            try:
                if route == "chat":
                    ok, result = await router.route(data)
                    await ws.send_json({"type": "chat", "ok": ok, "result": result})

                elif route == "voice":
                    result = await voice.handle_command(data)
                    await ws.send_json({"type": "voice", "result": result})

                elif route == "plugin":
                    ok, result = await plugin.run_plugin(
                        data.get("plugin_id"), data.get("payload", {})
                    )
                    await ws.send_json({"type": "plugin", "ok": ok, "result": result})

                else:
                    await ws.send_json({"error": "unknown_route"})

            except Exception as e:
                await ws.send_json({"error": str(e)})

    return ws


