docker-compose (cluster version)

version: "3.8"

services:
  redis-master:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  redis-replica:
    image: redis:7
    command: redis-server --replicaof redis-master 6379
    depends_on:
      - redis-master

  sentinel:
    image: redis:7
    command: redis-sentinel /etc/sentinel.conf
    volumes:
      - ./sentinel.conf:/etc/sentinel.conf
    ports:
      - "26379:26379"

  gateway:
    build: .
    deploy:
      replicas: 3
    depends_on:
      - redis-master


